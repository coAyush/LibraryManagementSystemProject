services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_app
    ports:
      - "${APP_PORT:-9090}:8080"
    environment:
      - DB_HOST=mydb
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-library}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-ayush52141}
      - MAIL_USERNAME=${MAIL_USERNAME:-librarysystemxyz@gmail.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-gwqsdlesgiwyrxvc}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_ENABLED=${MAIL_ENABLED:-true}
    depends_on:
      mydb:
        condition: service_healthy
    restart: unless-stopped

  mydb:
    image: mysql:8.0
    container_name: lms_db
    command: --default-authentication-plugin=mysql_native_password --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ayush52141}
      MYSQL_DATABASE: ${DB_NAME:-library}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./LibraryManagementDatabase.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-ayush52141}" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  db_data:
