<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Library Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(135deg, #eef2f7 0%, #dbe2ef 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .register-card {
            background: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 440px;
        }
    </style>
</head>
<body>

<div class="register-card p-4 p-sm-5">
    <div class="text-center mb-4">
        <div class="fs-1">📝</div>
        <h3 class="fw-bold mb-1">Student Registration</h3>
        <p class="text-muted small">Create an account to browse and issue books</p>
    </div>

    <form action="RegisterServlet" method="post">
        <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control form-control-lg fs-6" name="name" id="name" placeholder="Enter your full name" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control form-control-lg fs-6" name="email" id="email" placeholder="name@example.com" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control form-control-lg fs-6" name="password" id="password" placeholder="Create a secure password" required>
        </div>

        <div class="mb-4">
            <label for="role" class="form-label fw-semibold">Role</label>
            <select class="form-select form-control-lg fs-6" name="role" id="role" required>
                <option value="Student" selected>Student</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Complete Registration</button>
    </form>

    <div class="text-center mt-4 pt-2 border-top small">
        <span class="text-muted">Already have an account?</span> 
        <a href="Login.jsp" class="text-decoration-none fw-semibold">Log in here</a>
    </div>
    <div class="text-center mt-2">
        <a href="index.jsp" class="text-muted small text-decoration-none">← Back to Home</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
